<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | High Class Steel Craft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:ital,wght@0,300..800;1,300..800&family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --white:#ffffff; --grey-50:#f7f7f8; --grey-100:#eceeef; --grey-200:#dde0e2;
  --grey-300:#b9bfc4; --steel:#5b6770; --ink:#23282b; --spark:#ff6a3d;
  --ff-display:'Google Sans','Google Sans Text',sans-serif;
  --ff-body:'Google Sans Text','Google Sans',sans-serif;
  --ff-mono:'Google Sans Code',monospace;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:var(--ff-body); background:var(--grey-50); color:var(--ink);
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  background-image:linear-gradient(var(--grey-100) 1px, transparent 1px), linear-gradient(90deg, var(--grey-100) 1px, transparent 1px);
  background-size:42px 42px;
}
.card{
  background:#fff; border:1px solid var(--grey-200); border-radius:2px; padding:48px;
  width:380px; box-shadow:0 30px 70px -40px rgba(35,40,43,0.25);
  animation:rise .6s cubic-bezier(.25,.8,.25,1);
}
@keyframes rise{ from{opacity:0; transform:translateY(24px);} to{opacity:1; transform:translateY(0);} }
.logo-mark{ width:40px; height:40px; margin-bottom:18px; }
h1{ font-family:var(--ff-display); font-weight:700; font-size:1.5rem; margin-bottom:6px; }
.sub{ font-family:var(--ff-mono); font-size:0.75rem; letter-spacing:0.12em; text-transform:uppercase; color:var(--steel); margin-bottom:30px; }
.form-group{ display:flex; flex-direction:column; gap:6px; margin-bottom:18px; }
label{ font-family:var(--ff-mono); font-size:0.7rem; text-transform:uppercase; letter-spacing:0.1em; color:var(--steel); }
input{
  font-family:var(--ff-body); font-size:0.95rem; padding:13px 14px; border:1px solid var(--grey-200);
  border-radius:2px; background:var(--grey-50); outline:none; transition:border-color .25s ease, background .25s ease;
}
input:focus{ border-color:var(--spark); background:#fff; }
button{
  width:100%; padding:14px; border:none; border-radius:2px; background:var(--ink); color:#fff;
  font-family:var(--ff-body); font-weight:500; font-size:0.95rem; cursor:pointer; margin-top:8px;
  transition:background .25s ease, transform .25s ease;
}
button:hover{ background:var(--spark); transform:translateY(-2px); }
.error{ color:#d64545; font-size:0.85rem; margin-top:14px; font-family:var(--ff-mono); display:none; }
.error.show{ display:block; }
.hint{ margin-top:24px; padding-top:18px; border-top:1px solid var(--grey-100); font-size:0.78rem; color:var(--grey-300); font-family:var(--ff-mono); text-align:center; }
.back{ display:inline-block; margin-top:22px; font-size:0.85rem; color:var(--steel); text-decoration:none; }
.back:hover{ color:var(--spark); }
</style>
</head>
<body>
<div class="card">
  <span class="logo-mark">
    <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="3" y="3" width="34" height="34" stroke="#23282b" stroke-width="2"/>
      <path d="M3 20H37" stroke="#23282b" stroke-width="2"/>
      <path d="M20 3V37" stroke="#23282b" stroke-width="2"/>
      <circle cx="20" cy="20" r="4" fill="#ff6a3d"/>
    </svg>
  </span>
  <h1>Admin Panel</h1>
  <div class="sub">High Class Steel Craft</div>
  <form id="loginForm">
    <div class="form-group">
      <label>Username</label>
      <input type="text" id="username" autocomplete="username" required>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" autocomplete="current-password" required>
    </div>
    <button type="submit">Sign In</button>
    <div class="error" id="errorMsg">Incorrect username or password.</div>
  </form>
  <div class="hint">Default: admin / steel123 (change in admin-config.js)</div>
  <a class="back" href="../index.html">&larr; Back to website</a>
</div>
<script src="admin-config.js"></script>
<script>
document.getElementById('loginForm').addEventListener('submit', function(e){
  e.preventDefault();
  const u = document.getElementById('username').value.trim();
  const p = document.getElementById('password').value;
  if (u === HCSC_ADMIN_CREDENTIALS.username && p === HCSC_ADMIN_CREDENTIALS.password) {
    sessionStorage.setItem('hcsc_admin_auth', '1');
    window.location.href = 'dashboard.html';
  } else {
    document.getElementById('errorMsg').classList.add('show');
  }
});
</script>
</body>
</html>
